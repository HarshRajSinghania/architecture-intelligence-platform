[project]
name = "architecture-intelligence-platform"
version = "0.5.1"
description = "Evidence-backed architecture intelligence from OpenAPI, AsyncAPI and OpenTelemetry."
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "mcp==2.2.0",
    "neo4j>=6.2.0",
    "openai>=3.3.1",
    "opentelemetry-proto>=1.44.0",
    "pydantic>=2",
    "pyyaml>=6.0.3",
    "rfc8785>=0.1.4",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "testcontainers>=4.15.0",
]

[tool.ruff]
line-length = 100
# Markdown isn't a formatting target here - this repo's *.md files are docs/frozen design specs,
# not code, and ruff's Markdown code-fence formatting would otherwise rewrite Python snippets
# embedded in historical spec documents (e.g. Protocol stub bodies) for no benefit.
extend-exclude = ["*.md"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pyright]
# Enforced in CI (`quality` job) over all of `app/`; `tests/` is not type-checked yet. Never loosen
# the mode, shrink `include` or suppress broadly (see AGENTS.md).
include = ["app"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "demo_e2e: Compose-based end-to-end tests for the runtime demo lifecycle",
]
