# Default PoC configuration (spec §17.1). NEO4J_URI overrides graph.uri (see
# docker-compose.yml); NEO4J_USER, NEO4J_PASSWORD, OPENAI_API_KEY are read
# from the environment only (spec §17.2), never from this file.
architecture_intelligence:
  sources:
    directories:
      - id: aip-bundled-examples-v0.5
        root: examples
        stable_target_identity: urn:aip:logical-root:bundled-examples
    # I1 spec §5.1.1's config/migrations/v0.5.0-bundled-example-identities.yaml artifact exists as a
    # real, tested migration artifact (see tests/integration/test_i1_bundled_migration_determinism.py)
    # but is deliberately NOT listed here: applying it would revert the bundled examples' real,
    # already-shipped owner-scoped identity (PR3a/3b) back to their legacy v0.4.2-era ids for every
    # default consumer of this file, undoing that migration rather than merely proving it exists.
    # migrations: []
  graph:
    uri: bolt://localhost:7687
    database: neo4j
    max_traversal_depth: 5
  import:
    openapi: true
    asyncapi: true
    architecture_manifest: true
  llm:
    enabled: true
    max_result_rows: 100
  intent_router:
    deterministic_threshold: 0.9
  telemetry:
    service_aliases: {}
    queue_aliases: {}
    topic_aliases: {}
    http-correlation:
      enabled: true
      ttl-seconds: 60
      max-pending-spans: 10000
    coverage:
      qualification-enabled: true
    scoped-evidence:
      enabled: false
      stream-id: otlp-http
  runtime_analysis:
    default_window_hours: 24
    default_environment: production
